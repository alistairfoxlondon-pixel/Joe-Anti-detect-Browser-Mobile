plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing: provided in CI through environment variables, or locally via an
// untracked keystore.properties file (never committed). Without either, release builds
// stay unsigned and debug builds always work.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def env = System.getenv()
def releaseStorePath = env.JOE_KEYSTORE_PATH ?: keystoreProps.getProperty('storeFile', '')
def releaseStorePass = env.JOE_KEYSTORE_PASSWORD ?: keystoreProps.getProperty('storePassword', '')
def releaseKeyAlias = env.JOE_KEY_ALIAS ?: keystoreProps.getProperty('keyAlias', 'joe-browser')
def releaseKeyPass = env.JOE_KEY_PASSWORD ?: keystoreProps.getProperty('keyPassword', releaseStorePass)
def releaseSigningAvailable = releaseStorePath && file(releaseStorePath).exists()

android {
    namespace 'com.joebrowser.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.joebrowser.app'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.6.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            if (releaseSigningAvailable) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
                storeType 'PKCS12'
                // Sign with every scheme the platform will accept. v1 (JAR) matters because
                // some file managers and older scanners only look at it; v2/v3 are what
                // Android 7+ actually verifies. An APK missing v1 is a common trigger for
                // "this file looks unsafe" prompts on Windows transfer tools.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.all { variant ->
        // Deterministic artefact names: what a user downloads should say what it is, and a
        // signed build should never be called "app-release-unsigned".
        variant.outputs.all { output ->
            def version = variant.versionName
            def suffix = variant.buildType.name == 'debug' ? 'debug' : 'release'
            outputFileName = "joe-browser-${version}-${suffix}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
}
