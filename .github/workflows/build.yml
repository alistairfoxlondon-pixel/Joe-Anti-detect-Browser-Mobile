name: Build

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.JOE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.JOE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.JOE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.JOE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify fingerprint layer
        shell: bash
        run: node tools/verify-fingerprint.js

      - name: Verify proxy relay
        shell: bash
        run: node tools/test-relay.js

      - name: Verify tracker classifier
        shell: bash
        run: node tools/test-trackers.js

      - name: Verify human typing engine
        shell: bash
        run: node tools/test-human-paste.js

      - name: Verify user-agent matrix
        shell: bash
        run: node tools/test-user-agent.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/joe-release.p12"

      - name: Build debug and release APKs
        id: build
        env:
          JOE_KEYSTORE_PATH: ${{ env.KEYSTORE_BASE64 != '' && format('{0}/joe-release.p12', runner.temp) || '' }}
          JOE_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          JOE_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          JOE_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p ci-logs
          set +e
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee ci-logs/build.log
          code=${PIPESTATUS[0]}
          echo "gradle_exit=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # The sandbox running the agent cannot stream the raw Actions log, so
      # surface the important lines as annotations (visible via the check-runs API).
      - name: Annotate build errors
        if: failure()
        shell: bash
        run: |
          [ -f ci-logs/build.log ] || { echo "::error::No build log captured"; exit 0; }
          grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by|> Task .* FAILED" ci-logs/build.log | head -70 | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
            echo "::error::$msg"
          done
          echo "::notice::---- context around 'What went wrong' ----"
          grep -m1 -n -A8 "What went wrong" ci-logs/build.log | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
            echo "::error::$msg"
          done
          echo "::notice::---- head of build log ----"
          head -n 40 ci-logs/build.log | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
            echo "::notice::$msg"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: joe-browser-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: joe-browser-apks
          path: apks

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=$(find apks -name '*.apk' -type f | sort)
          echo "Assets:"; echo "$assets"
          signed_note=$(if ls apks/release/*-signed* >/dev/null 2>&1 || ls apks/release/app-release.apk >/dev/null 2>&1; then echo "Release APK is signed."; else echo "Release APK is UNSIGNED (no signing secrets configured) — debug APK included for sideloading."; fi)
          gh release create "$tag" $assets \
            --title "Joe Browser ${tag}" \
            --notes "Joe Browser ${tag} — anti-detect browser for Android.

          ${signed_note}

          What's in this build: isolated per-profile storage (AndroidX WebKit MULTI_PROFILE where supported), proxy authentication via loopback relay (HTTP/HTTPS/SOCKS5), per-profile fingerprint engine (canvas/audio/hardware noise, screen/GPU/cores/memory/locale consistency, Android UA-CH architecture fixes), paste-as-human typing, built-in HTTP tracker counter, proxy library with parallel checks and offline/rotation alerts, history, backups via JSON export.

          New in v1.3.0: premium emerald design across every screen (launcher and store art redrawn), rebuilt browser chrome — one identity row, icon-only proxy/tracker actions, floating paste pill, no text overflow — fingerprint hardening for the detector sites (webdriver=false, rotating UA-CH GREASE brand with correct fullVersionList, tagged PluginArray/MimeTypeArray with linked references, permissions.query coherent with Notification.permission, profile locale in resolvedOptions, Accept-Language aligned with navigator.languages), cleartext traffic denied, private crash log, launcher shortcuts, overflow and crash fixes throughout.

          Previously in v1.2.0: multi-tab fingerprinted browsing, cookie import/export (JSON + Netscape), batch profile actions, quick proxy/fingerprint actions on profile cards, Trash Manager, dashboard 2x2 grid, MaterialSwitch and bottom-sheet overflow fixes.

          All data stays on the device. See README for honest limitations (Android WebView cannot run Chrome extensions or its own sandboxed profile engine; Firefox identities are UA-level only)."
