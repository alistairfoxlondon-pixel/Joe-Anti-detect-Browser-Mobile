name: Build

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.JOE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.JOE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.JOE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.JOE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Fail before Gradle if a layout references a resource that does not exist, or a
      # fragment uses a binding field its layout no longer has. These are the two failure
      # classes that used to surface 4 minutes into a Gradle run.
      - name: Static resource audit
        shell: bash
        run: node tools/verify-resources.js

      # Copy budget: how much of the 1.4.0 baseline wording survived, and how much of the new
      # text belongs to features that did not exist. Printed on every run so the "less text"
      # requirement stays measurable instead of being asserted.
      - name: Copy budget report
        shell: bash
        run: node tools/copy-report.js

      # The icon set, launcher art and store images are generated from one source of truth.
      # Regenerate and fail if the committed output has drifted (a stale icon ships as a bug).
      - name: Verify generated assets are current
        shell: bash
        run: |
          node tools/generate-assets.js --icons-only
          node tools/generate-assets.js --check
          git diff --exit-code --stat app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 \
            || { echo "::error::Generated assets are stale. Run: node tools/generate-assets.js"; exit 1; }

      - name: Verify fingerprint layer
        shell: bash
        run: node tools/verify-fingerprint.js

      - name: Verify proxy relay
        shell: bash
        run: node tools/test-relay.js

      - name: Verify tracker classifier
        shell: bash
        run: node tools/test-trackers.js

      - name: Verify human typing engine
        shell: bash
        run: node tools/test-human-paste.js

      - name: Verify user-agent matrix
        shell: bash
        run: node tools/test-user-agent.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/joe-release.p12"

      - name: Build APKs
        id: build
        env:
          JOE_KEYSTORE_PATH: ${{ env.KEYSTORE_BASE64 != '' && format('{0}/joe-release.p12', runner.temp) || '' }}
          JOE_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          JOE_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          JOE_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p ci-logs
          set +e
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee ci-logs/build.log
          code=${PIPESTATUS[0]}
          echo "gradle_exit=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # The sandbox running the agent cannot stream the raw Actions log, so
      # surface the important lines as annotations (visible via the check-runs API).
      - name: Annotate build errors
        if: failure()
        shell: bash
        run: |
          [ -f ci-logs/build.log ] || { echo "::error::No build log captured"; exit 0; }
          grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by|> Task .* FAILED" ci-logs/build.log | head -70 | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
            echo "::error::$msg"
          done
          echo "::notice::---- context around 'What went wrong' ----"
          grep -m1 -n -A8 "What went wrong" ci-logs/build.log | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
            echo "::error::$msg"
          done
          echo "::notice::---- head of build log ----"
          head -n 40 ci-logs/build.log | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
            echo "::notice::$msg"
          done

      # Deterministic, human-readable output names. "app-debug.apk" tells a user nothing and
      # an unsigned "app-release-unsigned.apk" is what made Windows throw the file away on
      # download: an APK with no signature cannot be verified, so SmartScreen / Defender
      # quarantines it. We name what we ship and we only ship verifiable files.
      - name: Name and verify APKs
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          code=$(grep -oP "versionCode\s+\K[0-9]+" app/build.gradle)
          out=dist
          mkdir -p "$out"

          debug_apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$debug_apk" "$out/joe-browser-$version-debug.apk"

          # A release APK is only redistributed when it is actually signed. An unsigned one is
          # unusable to the user and is exactly the artefact antivirus products reject.
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1 || true)
          if [ -n "${release_apk:-}" ]; then
            cp "$release_apk" "$out/joe-browser-$version-release.apk"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
            # An unsigned release APK cannot be installed on Android at all, and it is the exact
            # artefact Windows scanners quarantine. Publishing it (or silently substituting a
            # debug build) is what made 1.4.0 "fail to install"; say so on the run summary
            # instead of leaving a green tick over an uninstallable download.
            {
              echo "### ⚠ Release APK is unsigned"
              echo ""
              echo "No keystore secrets are configured, so only the debug-signed APK was published."
              echo "An unsigned APK cannot be installed and will be quarantined by Windows."
              echo "See \`tools/make-keystore.md\` to create and register the release keystore."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Release unsigned — only the debug APK is installable. See tools/make-keystore.md"
          fi

          ls -la "$out"
          # Best-effort signature dump: apksigner ships with the Android build-tools image.
          if command -v apksigner >/dev/null 2>&1; then
            for f in "$out"/*.apk; do
              echo "---- $f"; apksigner verify --print-certs "$f" || true
            done
          else
            find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -r | head -1 | xargs -r -I{} sh -c 'for f in '"$out"'/*.apk; do echo "---- $f"; {} verify --print-certs "$f" || true; done'
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: joe-browser-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ci-logs/build.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: joe-browser-apks
          path: apks

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=$(find apks -name '*.apk' -type f | sort)
          echo "Assets:"; echo "$assets"

          # SHA-256 sums so a user (and Defender's "known file" reputation) can verify the
          # exact bytes they downloaded. An APK handed around without a checksum is the most
          # common reason a scanner declines to trust it.
          ( cd apks && sha256sum *.apk > SHA256SUMS.txt )
          assets="$assets apks/SHA256SUMS.txt"

          if ls apks/*-release.apk >/dev/null 2>&1; then
            signed_note="Signed release APK attached. Verify with \`apksigner verify\` and the SHA-256 sums below."
          else
            signed_note="No signing key was configured for this build, so only the debug-signed APK is attached. Install it by allowing your file manager to install unknown apps; see INSTALL.md."
          fi

          gh release create "$tag" $assets \
            --title "Joe Browser ${tag}" \
            --notes-file - <<NOTES
          ## Joe Browser ${tag}

          ${signed_note}

          ### Install
          1. Download \`joe-browser-${tag#v}-debug.apk\` (or the release APK when present).
          2. Open it from your downloads, allow "install unknown apps" for the file manager once.
          3. Verify the SHA-256 in \`SHA256SUMS.txt\` if you want to be certain the file is intact.

          ### What's in this build
          - **Five engine families** with official brand marks (Chrome, Chromium, Brave, Edge, Firefox).
          - **Per-profile isolation**: cookies, storage, cache, proxy and fingerprint.
          - **Fingerprint engine**: coherent UA / UA-CH / screen / GPU / locale / timezone /
            canvas / audio / WebGL per profile, verified by \`tools/verify-fingerprint.js\`.
          - **Proxies**: HTTP, HTTPS, SOCKS5 with credentials through a loopback relay; live
            checks, watchlists, offline/recovered/rotation alerts and opt-in failover.
          - **Email + password sign-in** (on-device, no verification email, no server).
          - **Backups** (JSON export/restore), history, tracker counter, human typing.
          - **Fingerprint lab**: create a profile and test it on BrowserScan, IPHey, PixelScan,
            IPFighter, Whoer and CreepJS in one tap.

          ### Security notes
          No telemetry, no analytics SDK, no third-party network calls. Cleartext HTTP is
          disabled app-wide. Passwords are hashed with PBKDF2-HmacSHA256; proxy credentials are
          AES-256-GCM encrypted with a device-bound Keystore key.

          See \`INSTALL.md\` for the Windows/macOS "unrecognised app" explanation and the exact
          steps to install safely.
          NOTES
